<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos Inizitech</title>
<style>
  /* =========================================================
     VARIABLES DE DISEÑO (tema oscuro estilo plataforma de streaming)
     ========================================================= */
  :root {
    --fondo: #141414;
    --fondo-2: #1f1f1f;
    --fondo-3: #2a2a2a;
    --texto: #f5f5f5;
    --texto-2: #b3b3b3;
    --acento: #e50914;          /* Rojo para acciones principales */
    --acento-hover: #f6121d;
    --ok: #25d366;              /* Verde WhatsApp */
    --radio: 8px;
    --alto-header: 64px;
    --ancho-panel: 340px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--fondo); color: var(--texto); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    padding-top: var(--alto-header);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* =========================================================
     ENCABEZADO FIJO
     ========================================================= */
  .header {
    position: fixed; inset: 0 0 auto 0; z-index: 50;
    height: var(--alto-header);
    display: flex; align-items: center; gap: 16px;
    padding: 0 4%;
    background: linear-gradient(180deg, rgba(0,0,0,.95) 0%, rgba(20,20,20,.92) 100%);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #000;
  }
  .logo {
    font-weight: 900; font-size: 24px; letter-spacing: 1px;
    color: var(--acento); white-space: nowrap; text-transform: uppercase;
  }
  .busqueda {
    flex: 1; max-width: 420px; margin-left: auto;
    position: relative;
  }
  .busqueda input {
    width: 100%; height: 40px;
    padding: 0 12px 0 38px;
    background: rgba(0,0,0,.6);
    border: 1px solid #555; border-radius: 4px;
  }
  .busqueda input:focus { border-color: #fff; outline: none; }
  .busqueda svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; fill: var(--texto-2); pointer-events: none;
  }
  /* Botón del carrito (solo visible en móvil/tablet, donde el panel está oculto) */
  .btn-carrito {
    position: relative; height: 40px; padding: 0 12px;
    border-radius: 4px; background: var(--fondo-3);
    display: flex; align-items: center; gap: 6px; font-weight: 600;
  }
  .btn-carrito .burbuja {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--acento); font-size: 12px; line-height: 20px; text-align: center;
  }

  /* =========================================================
     FILTROS DE CATEGORÍA (chips)
     ========================================================= */
  .filtros {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 16px 4% 4px;
    scrollbar-width: none;
  }
  .filtros::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 16px; border-radius: 20px;
    background: var(--fondo-3); color: var(--texto-2);
    font-weight: 600; font-size: 14px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .chip:hover { color: var(--texto); }
  .chip.activo { background: var(--texto); color: #000; }

  /* =========================================================
     DISEÑO PRINCIPAL: catálogo + panel de pedido
     ========================================================= */
  .contenido { padding-bottom: 96px; }      /* espacio para la barra inferior en móvil */
  .fila { margin: 22px 0 8px; }
  .fila h2 {
    font-size: 19px; font-weight: 700; padding: 0 4%; margin-bottom: 10px;
  }
  .fila h2 small { color: var(--texto-2); font-weight: 400; font-size: 14px; margin-left: 6px; }

  /* Carrusel horizontal con desplazamiento táctil y "snap" */
  .carrusel {
    display: grid; grid-auto-flow: column;
    grid-auto-columns: minmax(200px, 230px);
    gap: 10px;
    overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scroll-padding-inline: 4%;          /* respeta el margen al ajustar el scroll */
    padding: 4px 4% 14px;
    scrollbar-width: thin; scrollbar-color: #444 transparent;
  }
  /* Con búsqueda activa se muestran los resultados en cuadrícula (más fácil de escanear) */
  .carrusel.cuadricula {
    grid-auto-flow: row;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    overflow: visible;
  }

  /* =========================================================
     TARJETA DE PRODUCTO
     ========================================================= */
  .tarjeta {
    scroll-snap-align: start;
    background: var(--fondo-2); border-radius: var(--radio);
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .18s ease, box-shadow .18s ease;
    border: 2px solid transparent;
  }
  .tarjeta:hover { transform: scale(1.03); box-shadow: 0 10px 24px rgba(0,0,0,.6); }
  .tarjeta.en-pedido { border-color: var(--acento); }
  .miniatura {
    position: relative; aspect-ratio: 16 / 10;
    background: var(--fondo-3); overflow: hidden;
  }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniatura .badge-cant {
    position: absolute; top: 8px; right: 8px;
    background: var(--acento); color: #fff; font-weight: 800;
    padding: 2px 9px; border-radius: 12px; font-size: 13px;
  }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .nombre { font-weight: 600; font-size: 14px; min-height: 2.8em; }
  .precio { color: var(--texto-2); font-size: 14px; }
  .precio b { color: var(--texto); font-size: 16px; }

  /* Botón "Agregar" grande y visible; se transforma en selector de cantidad */
  /* Contenedor del control: se pega al fondo de la tarjeta y ocupa todo el ancho */
  [data-control] { margin-top: auto; }
  .btn-agregar {
    width: 100%; height: 40px; border-radius: 4px;
    background: var(--texto); color: #000; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s;
  }
  .btn-agregar:hover { background: #d6d6d6; }
  .stepper {
    height: 40px; display: grid;
    grid-template-columns: 40px 1fr 40px; align-items: center;
    background: var(--fondo-3); border-radius: 4px; overflow: hidden;
  }
  .stepper button {
    height: 100%; font-size: 22px; font-weight: 700;
    background: var(--acento); color: #fff;
  }
  .stepper button:hover { background: var(--acento-hover); }
  .stepper input {
    width: 100%; height: 100%; text-align: center; font-weight: 700; font-size: 16px;
    background: transparent; border: 0;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .vacio-busqueda { padding: 40px 4%; color: var(--texto-2); text-align: center; }

  /* =========================================================
     PANEL DEL PEDIDO
     - Escritorio: barra lateral fija siempre visible.
     - Móvil: cajón que sube desde abajo.
     ========================================================= */
  .panel {
    position: fixed; z-index: 60;
    background: var(--fondo-2);
    display: flex; flex-direction: column;
  }
  .panel-cabecera {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid #333;
  }
  .panel-cabecera h3 { font-size: 17px; }
  .btn-texto { color: var(--texto-2); font-size: 13px; text-decoration: underline; }
  .btn-cerrar { font-size: 26px; line-height: 1; padding: 0 4px; color: var(--texto-2); }

  .lista { flex: 1; overflow-y: auto; padding: 6px 16px; }
  .item {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
    padding: 10px 0; border-bottom: 1px solid #2c2c2c;
  }
  .item-nombre { font-size: 14px; font-weight: 600; }
  .item-subtotal { font-weight: 700; text-align: right; }
  .item-detalle { color: var(--texto-2); font-size: 13px; }
  .mini-stepper { display: flex; align-items: center; gap: 4px; justify-self: end; }
  .mini-stepper button {
    width: 28px; height: 28px; border-radius: 4px; background: var(--fondo-3);
    font-weight: 700; font-size: 16px;
  }
  .mini-stepper button:hover { background: #3a3a3a; }
  .mini-stepper span { min-width: 24px; text-align: center; font-weight: 700; }
  .lista-vacia { color: var(--texto-2); text-align: center; padding: 30px 8px; font-size: 14px; }

  .panel-pie { padding: 12px 16px 16px; border-top: 1px solid #333; display: grid; gap: 10px; }
  .panel-pie input, .panel-pie textarea {
    width: 100%; padding: 9px 11px; border-radius: 4px;
    background: var(--fondo-3); border: 1px solid #3a3a3a; resize: none;
  }
  .panel-pie input:focus, .panel-pie textarea:focus { border-color: #888; outline: none; }
  .total { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
  .total b { font-size: 22px; }
  .btn-principal {
    height: 48px; border-radius: 4px; background: var(--acento);
    color: #fff; font-weight: 800; font-size: 16px;
  }
  .btn-principal:hover { background: var(--acento-hover); }
  .btn-principal:disabled { background: #555; color: #999; cursor: not-allowed; }

  /* Barra inferior fija (solo móvil) con total y acceso al pedido */
  .barra-inferior {
    position: fixed; inset: auto 0 0 0; z-index: 40;
    padding: 10px 4% calc(10px + env(safe-area-inset-bottom));
    background: rgba(10,10,10,.97); border-top: 1px solid #333;
    display: flex; align-items: center; gap: 12px;
  }
  .barra-inferior .resumen { flex: 1; font-size: 13px; color: var(--texto-2); }
  .barra-inferior .resumen b { display: block; color: var(--texto); font-size: 18px; }
  .barra-inferior .btn-principal { padding: 0 22px; }

  .velo {
    position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .velo.visible { opacity: 1; pointer-events: auto; }

  /* --- Móvil y tablet: el panel es un cajón inferior --- */
  @media (max-width: 1023px) {
    .panel {
      inset: auto 0 0 0; max-height: 88vh;
      border-radius: 14px 14px 0 0;
      transform: translateY(100%); transition: transform .25s ease;
    }
    .panel.abierto { transform: translateY(0); }
  }

  /* --- Escritorio: panel lateral siempre visible --- */
  @media (min-width: 1024px) {
    .contenido { margin-right: var(--ancho-panel); padding-bottom: 40px; }
    .panel {
      top: var(--alto-header); right: 0; bottom: 0; width: var(--ancho-panel);
      border-left: 1px solid #000;
    }
    .btn-cerrar, .barra-inferior, .btn-carrito, .velo { display: none !important; }
  }

  /* --- Teléfonos pequeños --- */
  @media (max-width: 560px) {
    .header { gap: 10px; }
    .logo { font-size: 18px; }
    .btn-carrito .txt { display: none; }
    .carrusel { grid-auto-columns: 46%; gap: 8px; }
    .carrusel.cuadricula { grid-template-columns: repeat(2, 1fr); }
    .nombre { font-size: 13px; }
    .tarjeta:hover { transform: none; }
  }

  /* =========================================================
     MODAL DE CONFIRMACIÓN (resumen para copiar / WhatsApp)
     ========================================================= */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(0,0,0,.75);
  }
  .modal.visible { display: flex; }
  .modal-caja {
    width: 100%; max-width: 520px; max-height: 92vh;
    background: var(--fondo-2); border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-caja pre {
    flex: 1; overflow: auto; margin: 0 16px; padding: 14px;
    background: #0d0d0d; border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    white-space: pre-wrap; word-break: break-word;
  }
  .modal-acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
  .btn-secundario {
    height: 48px; border-radius: 4px; background: var(--fondo-3); font-weight: 700;
  }
  .btn-secundario:hover { background: #3a3a3a; }
  .btn-whatsapp { background: var(--ok); color: #fff; }
  .btn-whatsapp:hover { background: #1fb457; }
  .modal-nuevo { padding: 0 16px 16px; text-align: center; }

  /* Aviso flotante breve ("Copiado", etc.) */
  .toast {
    position: fixed; left: 50%; bottom: 90px; z-index: 200;
    transform: translate(-50%, 20px); opacity: 0;
    background: #fff; color: #000; font-weight: 700;
    padding: 10px 18px; border-radius: 20px;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<!-- ===================== ENCABEZADO ===================== -->
<header class="header">
  <div class="logo">Inizitech</div>
  <label class="busqueda">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="buscar" type="search" placeholder="Buscar producto…  ( / )" autocomplete="off" aria-label="Buscar producto por nombre">
  </label>
  <button class="btn-carrito" id="btnCarrito" aria-label="Ver pedido">
    🛒 <span class="txt">Pedido</span> <span class="burbuja" id="burbuja">0</span>
  </button>
</header>

<!-- ===================== CATÁLOGO ===================== -->
<main class="contenido">
  <nav class="filtros" id="filtros" aria-label="Filtrar por categoría"></nav>
  <div id="catalogo"></div>
</main>

<!-- ===================== PANEL DE PEDIDO ===================== -->
<div class="velo" id="velo"></div>
<aside class="panel" id="panel" aria-label="Resumen del pedido">
  <div class="panel-cabecera">
    <h3>Tu pedido <span id="contadorPanel" style="color:var(--texto-2);font-weight:400"></span></h3>
    <div>
      <button class="btn-texto" id="btnVaciar">Vaciar</button>
      <button class="btn-cerrar" id="btnCerrar" aria-label="Cerrar">×</button>
    </div>
  </div>
  <div class="lista" id="lista"></div>
  <div class="panel-pie">
    <input id="nombreCliente" type="text" placeholder="Tu nombre o área (opcional)" autocomplete="name">
    <textarea id="notas" rows="2" placeholder="Notas: entrega, urgencia… (opcional)"></textarea>
    <div class="total"><span>Total</span><b id="total">$0.00</b></div>
    <button class="btn-principal" id="btnEnviar" disabled>Enviar pedido</button>
  </div>
</aside>

<!-- Barra inferior (móvil) -->
<div class="barra-inferior">
  <div class="resumen"><span id="barraItems">0 productos</span><b id="barraTotal">$0.00</b></div>
  <button class="btn-principal" id="btnVerPedido">Ver pedido</button>
</div>

<!-- ===================== MODAL DE RESUMEN ===================== -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
  <div class="modal-caja">
    <div class="panel-cabecera">
      <h3 id="tituloModal">✅ Pedido listo para enviar</h3>
      <button class="btn-cerrar" style="display:block" id="btnCerrarModal" aria-label="Cerrar">×</button>
    </div>
    <p style="padding:12px 16px 10px;color:var(--texto-2);font-size:14px">
      Copia el resumen o envíalo directo por WhatsApp.
    </p>
    <pre id="textoResumen"></pre>
    <div class="modal-acciones">
      <button class="btn-secundario" id="btnCopiar">📋 Copiar</button>
      <button class="btn-secundario btn-whatsapp" id="btnWhatsapp">WhatsApp</button>
    </div>
    <div class="modal-nuevo">
      <button class="btn-texto" id="btnNuevo">Empezar un pedido nuevo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURACIÓN GENERAL
   Ajusta aquí el número de WhatsApp, la moneda y el negocio.
   ========================================================= */
const CONFIG = {
  negocio: 'Inizitech',
  // Número de WhatsApp destino en formato internacional SIN "+" ni espacios (ej. '5215512345678').
  // Si se deja vacío, WhatsApp pedirá elegir el contacto al abrirse.
  whatsapp: '',
  moneda: 'USD',
  idioma: 'es-MX',
  claveStorage: 'inizitech_pedido_v1'
};

/* =========================================================
   CATÁLOGO DE EJEMPLO
   Campo "imagen": URL de la foto real. Si está vacío, se genera
   una miniatura automática (funciona sin internet).
   ========================================================= */
const PRODUCTOS = [
  // Cómputo
  { id: 'p01', nombre: 'Laptop 14" Core i5 16GB',      precio: 749.00, categoria: 'Cómputo',     icono: '💻', imagen: '' },
  { id: 'p02', nombre: 'Monitor 24" Full HD',           precio: 139.90, categoria: 'Cómputo',     icono: '🖥️', imagen: '' },
  { id: 'p03', nombre: 'Mini PC Ryzen 5',               precio: 389.00, categoria: 'Cómputo',     icono: '🧮', imagen: '' },
  { id: 'p04', nombre: 'Tablet 10" 128GB',              precio: 229.00, categoria: 'Cómputo',     icono: '📱', imagen: '' },
  { id: 'p05', nombre: 'Disco SSD 1TB NVMe',            precio: 74.50,  categoria: 'Cómputo',     icono: '💽', imagen: '' },
  // Periféricos
  { id: 'p06', nombre: 'Teclado inalámbrico',           precio: 24.90,  categoria: 'Periféricos', icono: '⌨️', imagen: '' },
  { id: 'p07', nombre: 'Mouse ergonómico',              precio: 19.90,  categoria: 'Periféricos', icono: '🖱️', imagen: '' },
  { id: 'p08', nombre: 'Audífonos con micrófono',       precio: 34.00,  categoria: 'Periféricos', icono: '🎧', imagen: '' },
  { id: 'p09', nombre: 'Cámara web 1080p',              precio: 39.90,  categoria: 'Periféricos', icono: '📷', imagen: '' },
  { id: 'p10', nombre: 'Hub USB-C 7 en 1',              precio: 29.90,  categoria: 'Periféricos', icono: '🔌', imagen: '' },
  { id: 'p11', nombre: 'Soporte para laptop',           precio: 21.50,  categoria: 'Periféricos', icono: '📐', imagen: '' },
  // Redes
  { id: 'p12', nombre: 'Router Wi-Fi 6',                precio: 89.00,  categoria: 'Redes',       icono: '📶', imagen: '' },
  { id: 'p13', nombre: 'Switch 8 puertos Gigabit',      precio: 32.00,  categoria: 'Redes',       icono: '🔀', imagen: '' },
  { id: 'p14', nombre: 'Cable de red Cat6 (3 m)',       precio: 4.50,   categoria: 'Redes',       icono: '🧵', imagen: '' },
  { id: 'p15', nombre: 'Access Point de techo',         precio: 119.00, categoria: 'Redes',       icono: '📡', imagen: '' },
  // Oficina
  { id: 'p16', nombre: 'Resma papel carta (500 h)',     precio: 6.90,   categoria: 'Oficina',     icono: '📄', imagen: '' },
  { id: 'p17', nombre: 'Tóner para impresora láser',    precio: 58.00,  categoria: 'Oficina',     icono: '🖨️', imagen: '' },
  { id: 'p18', nombre: 'Caja de bolígrafos (12)',       precio: 3.80,   categoria: 'Oficina',     icono: '🖊️', imagen: '' },
  { id: 'p19', nombre: 'Libreta profesional',           precio: 2.90,   categoria: 'Oficina',     icono: '📓', imagen: '' },
  { id: 'p20', nombre: 'Regulador / No-break 750VA',    precio: 79.00,  categoria: 'Oficina',     icono: '🔋', imagen: '' },
  // Software y servicios
  { id: 'p21', nombre: 'Licencia antivirus (1 año)',    precio: 29.00,  categoria: 'Software',    icono: '🛡️', imagen: '' },
  { id: 'p22', nombre: 'Suite ofimática (1 usuario)',   precio: 99.00,  categoria: 'Software',    icono: '🧾', imagen: '' },
  { id: 'p23', nombre: 'Soporte técnico (1 hora)',      precio: 25.00,  categoria: 'Software',    icono: '🛠️', imagen: '' }
];

/* Colores de fondo por categoría para las miniaturas generadas */
const COLORES_CATEGORIA = {
  'Cómputo':     ['#3a0ca3', '#7209b7'],
  'Periféricos': ['#b5179e', '#f72585'],
  'Redes':       ['#0077b6', '#00b4d8'],
  'Oficina':     ['#bc6c25', '#dda15e'],
  'Software':    ['#2d6a4f', '#52b788']
};

/* =========================================================
   ESTADO DE LA APLICACIÓN
   ========================================================= */
const estado = {
  categoria: 'Todas',   // filtro de categoría activo
  busqueda: '',         // texto de búsqueda
  carrito: {}           // { idProducto: cantidad }
};

/* Atajos para el DOM */
const $ = (sel) => document.querySelector(sel);
const formatoMoneda = new Intl.NumberFormat(CONFIG.idioma, { style: 'currency', currency: CONFIG.moneda, currencyDisplay: 'narrowSymbol' });
const dinero = (n) => formatoMoneda.format(n);
const productoPorId = Object.fromEntries(PRODUCTOS.map(p => [p.id, p]));

/* =========================================================
   PERSISTENCIA LOCAL
   El pedido se guarda en el navegador para no perderlo si se
   recarga la página. Todo va en try/catch por si el navegador
   bloquea el almacenamiento (modo privado, etc.).
   ========================================================= */
function guardar() {
  try {
    localStorage.setItem(CONFIG.claveStorage, JSON.stringify({
      carrito: estado.carrito,
      nombre: $('#nombreCliente').value
    }));
  } catch (e) { /* sin almacenamiento: la app sigue funcionando */ }
}
function cargar() {
  try {
    const datos = JSON.parse(localStorage.getItem(CONFIG.claveStorage) || '{}');
    if (datos.carrito) {
      // Solo se restauran productos que sigan existiendo en el catálogo
      for (const [id, cant] of Object.entries(datos.carrito)) {
        if (productoPorId[id] && cant > 0) estado.carrito[id] = cant;
      }
    }
    if (datos.nombre) $('#nombreCliente').value = datos.nombre;
  } catch (e) { /* ignorar datos corruptos */ }
}

/* =========================================================
   MINIATURAS
   Genera una imagen SVG (como data URI) con degradado + icono,
   para que la página funcione sin depender de imágenes externas.
   ========================================================= */
function miniaturaGenerada(p) {
  const [c1, c2] = COLORES_CATEGORIA[p.categoria] || ['#333', '#555'];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="320" height="200" fill="url(#g)"/>
    <circle cx="260" cy="30" r="90" fill="#fff" opacity=".08"/>
    <text x="160" y="118" font-size="84" text-anchor="middle" dominant-baseline="middle">${p.icono}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const urlImagen = (p) => p.imagen || miniaturaGenerada(p);

/* =========================================================
   FILTRADO
   ========================================================= */
// Normaliza texto: minúsculas y sin acentos (así "computo" encuentra "Cómputo")
const normalizar = (t) => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function productosFiltrados() {
  const q = normalizar(estado.busqueda.trim());
  return PRODUCTOS.filter(p =>
    (estado.categoria === 'Todas' || p.categoria === estado.categoria) &&
    (!q || normalizar(p.nombre).includes(q) || normalizar(p.categoria).includes(q))
  );
}

/* =========================================================
   RENDERIZADO: chips de categoría
   ========================================================= */
function renderFiltros() {
  const categorias = ['Todas', ...new Set(PRODUCTOS.map(p => p.categoria))];
  $('#filtros').innerHTML = categorias.map(c =>
    `<button class="chip ${c === estado.categoria ? 'activo' : ''}" data-categoria="${c}">${c}</button>`
  ).join('');
}

/* =========================================================
   RENDERIZADO: tarjeta individual
   ========================================================= */
function htmlControl(p) {
  const cant = estado.carrito[p.id] || 0;
  if (!cant) {
    return `<button class="btn-agregar" data-accion="sumar" data-id="${p.id}">+ Agregar</button>`;
  }
  return `<div class="stepper">
      <button data-accion="restar" data-id="${p.id}" aria-label="Quitar uno">−</button>
      <input type="number" min="0" inputmode="numeric" value="${cant}" data-id="${p.id}" aria-label="Cantidad de ${p.nombre}">
      <button data-accion="sumar" data-id="${p.id}" aria-label="Agregar uno">+</button>
    </div>`;
}

function htmlTarjeta(p) {
  const cant = estado.carrito[p.id] || 0;
  return `<article class="tarjeta ${cant ? 'en-pedido' : ''}" data-tarjeta="${p.id}">
      <div class="miniatura">
        <img src="${urlImagen(p)}" alt="${p.nombre}" loading="lazy">
        ${cant ? `<span class="badge-cant">${cant}</span>` : ''}
      </div>
      <div class="info">
        <div class="nombre">${p.nombre}</div>
        <div class="precio"><b>${dinero(p.precio)}</b></div>
        <div data-control="${p.id}">${htmlControl(p)}</div>
      </div>
    </article>`;
}

/* =========================================================
   RENDERIZADO: catálogo completo (filas por categoría)
   ========================================================= */
function renderCatalogo() {
  const lista = productosFiltrados();
  const contenedor = $('#catalogo');

  if (!lista.length) {
    contenedor.innerHTML = `<p class="vacio-busqueda">No hay productos que coincidan con "<b>${escaparHTML(estado.busqueda)}</b>".</p>`;
    return;
  }

  // Con búsqueda o una sola categoría: cuadrícula única (se ve todo de un vistazo)
  if (estado.busqueda.trim() || estado.categoria !== 'Todas') {
    const titulo = estado.busqueda.trim() ? 'Resultados' : estado.categoria;
    contenedor.innerHTML = `<section class="fila">
        <h2>${titulo}<small>${lista.length} productos</small></h2>
        <div class="carrusel cuadricula">${lista.map(htmlTarjeta).join('')}</div>
      </section>`;
    return;
  }

  // Vista inicial: una fila horizontal por categoría (estilo streaming).
  const grupos = {};
  lista.forEach(p => (grupos[p.categoria] ||= []).push(p));
  contenedor.innerHTML = Object.entries(grupos).map(([cat, prods]) => `
      <section class="fila">
        <h2>${cat}<small>${prods.length}</small></h2>
        <div class="carrusel">${prods.map(htmlTarjeta).join('')}</div>
      </section>`).join('');
}

/* Actualiza solo las tarjetas de un producto (evita redibujar todo y perder el scroll) */
function actualizarTarjeta(id) {
  const p = productoPorId[id];
  const cant = estado.carrito[id] || 0;
  document.querySelectorAll(`[data-tarjeta="${id}"]`).forEach(t => {
    t.classList.toggle('en-pedido', cant > 0);
    const mini = t.querySelector('.miniatura');
    const badge = mini.querySelector('.badge-cant');
    if (cant) {
      if (badge) badge.textContent = cant;
      else mini.insertAdjacentHTML('beforeend', `<span class="badge-cant">${cant}</span>`);
    } else if (badge) badge.remove();

    // No se reemplaza el control si el usuario está escribiendo en el campo de cantidad
    const control = t.querySelector(`[data-control="${id}"]`);
    if (!control.contains(document.activeElement) || document.activeElement.tagName !== 'INPUT') {
      control.innerHTML = htmlControl(p);
    }
  });
}

/* =========================================================
   RENDERIZADO: panel del pedido, total y barra inferior
   ========================================================= */
function lineasPedido() {
  return Object.entries(estado.carrito)
    .filter(([, c]) => c > 0)
    .map(([id, cant]) => ({ p: productoPorId[id], cant, subtotal: productoPorId[id].precio * cant }));
}

function renderPedido() {
  const lineas = lineasPedido();
  const unidades = lineas.reduce((s, l) => s + l.cant, 0);
  const total = lineas.reduce((s, l) => s + l.subtotal, 0);

  $('#lista').innerHTML = lineas.length
    ? lineas.map(({ p, cant, subtotal }) => `
        <div class="item">
          <div class="item-nombre">${p.nombre}</div>
          <div class="item-subtotal">${dinero(subtotal)}</div>
          <div class="item-detalle">${dinero(p.precio)} c/u</div>
          <div class="mini-stepper">
            <button data-accion="restar" data-id="${p.id}" aria-label="Quitar uno">−</button>
            <span>${cant}</span>
            <button data-accion="sumar" data-id="${p.id}" aria-label="Agregar uno">+</button>
          </div>
        </div>`).join('')
    : `<p class="lista-vacia">Aún no hay productos.<br>Toca <b>+ Agregar</b> en cualquier tarjeta.</p>`;

  const textoUnidades = `${unidades} ${unidades === 1 ? 'producto' : 'productos'}`;
  $('#total').textContent = dinero(total);
  $('#barraTotal').textContent = dinero(total);
  $('#barraItems').textContent = textoUnidades;
  $('#burbuja').textContent = unidades;
  $('#contadorPanel').textContent = unidades ? `(${unidades})` : '';
  $('#btnEnviar').disabled = !lineas.length;
  $('#btnVerPedido').disabled = !lineas.length;
  $('#btnVaciar').style.visibility = lineas.length ? 'visible' : 'hidden';
}

/* =========================================================
   ACCIONES SOBRE EL CARRITO
   ========================================================= */
function fijarCantidad(id, cantidad) {
  const cant = Math.max(0, Math.min(999, Math.floor(Number(cantidad) || 0)));
  if (cant) estado.carrito[id] = cant;
  else delete estado.carrito[id];
  actualizarTarjeta(id);
  renderPedido();
  guardar();
}
const sumar = (id) => fijarCantidad(id, (estado.carrito[id] || 0) + 1);
const restar = (id) => fijarCantidad(id, (estado.carrito[id] || 0) - 1);

function vaciar() {
  const ids = Object.keys(estado.carrito);
  estado.carrito = {};
  ids.forEach(actualizarTarjeta);
  renderPedido();
  guardar();
}

/* =========================================================
   RESUMEN DEL PEDIDO (texto plano para copiar / WhatsApp)
   ========================================================= */
function generarResumen() {
  const lineas = lineasPedido();
  const total = lineas.reduce((s, l) => s + l.subtotal, 0);
  const nombre = $('#nombreCliente').value.trim();
  const notas = $('#notas').value.trim();
  const fecha = new Date().toLocaleString(CONFIG.idioma, { dateStyle: 'short', timeStyle: 'short' });
  const folio = 'P-' + Date.now().toString(36).toUpperCase().slice(-6);

  let t = `*PEDIDO ${CONFIG.negocio.toUpperCase()}*\n`;
  t += `Folio: ${folio}\nFecha: ${fecha}\n`;
  if (nombre) t += `Solicita: ${nombre}\n`;
  t += `\n`;
  lineas.forEach(({ p, cant, subtotal }) => {
    t += `• ${cant} x ${p.nombre}\n   ${dinero(p.precio)} c/u = ${dinero(subtotal)}\n`;
  });
  t += `\n*TOTAL: ${dinero(total)}*`;
  t += `\n(${lineas.reduce((s, l) => s + l.cant, 0)} unidades)`;
  if (notas) t += `\n\nNotas: ${notas}`;
  return t;
}

function abrirModal() {
  if (!lineasPedido().length) return;
  $('#textoResumen').textContent = generarResumen();
  $('#modal').classList.add('visible');
  cerrarPanel();
  $('#btnWhatsapp').focus();
}
function cerrarModal() { $('#modal').classList.remove('visible'); }

async function copiarResumen() {
  const texto = $('#textoResumen').textContent;
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    // Alternativa para navegadores que bloquean el portapapeles al abrir con file://
    const ta = document.createElement('textarea');
    ta.value = texto; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  aviso('Resumen copiado ✔');
}

function enviarWhatsapp() {
  const texto = encodeURIComponent($('#textoResumen').textContent);
  const url = `https://wa.me/${CONFIG.whatsapp}?text=${texto}`;
  window.open(url, '_blank', 'noopener');
}

/* =========================================================
   UTILIDADES
   ========================================================= */
function escaparHTML(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
let temporizadorAviso;
function aviso(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('visible');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => t.classList.remove('visible'), 1600);
}
function abrirPanel() { $('#panel').classList.add('abierto'); $('#velo').classList.add('visible'); }
function cerrarPanel() { $('#panel').classList.remove('abierto'); $('#velo').classList.remove('visible'); }

/* =========================================================
   EVENTOS
   Se usa delegación: un solo listener para todos los botones +/−,
   así funciona aunque las tarjetas se vuelvan a dibujar.
   ========================================================= */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-accion]');
  if (btn) {
    btn.dataset.accion === 'sumar' ? sumar(btn.dataset.id) : restar(btn.dataset.id);
    return;
  }
  const chip = e.target.closest('[data-categoria]');
  if (chip) {
    estado.categoria = chip.dataset.categoria;
    renderFiltros();
    renderCatalogo();
  }
});

// Escribir la cantidad directamente (útil para pedidos grandes: 50, 100…)
document.addEventListener('input', (e) => {
  if (e.target.matches('.stepper input')) {
    const id = e.target.dataset.id;
    const valor = e.target.value;
    if (valor === '') return;            // permite borrar para escribir otro número
    fijarCantidad(id, valor);
  }
});
// Al salir del campo, si quedó vacío o en 0 se quita el producto
document.addEventListener('focusout', (e) => {
  if (e.target.matches('.stepper input')) {
    const id = e.target.dataset.id;
    setTimeout(() => fijarCantidad(id, e.target.value), 0);
  }
});
// Enter en el campo de cantidad confirma
document.addEventListener('keydown', (e) => {
  if (e.target.matches('.stepper input') && e.key === 'Enter') e.target.blur();
});

// Búsqueda en vivo
$('#buscar').addEventListener('input', (e) => {
  estado.busqueda = e.target.value;
  renderCatalogo();
});

// Atajos de teclado: "/" enfoca la búsqueda, "Esc" cierra panel/modal
document.addEventListener('keydown', (e) => {
  const escribiendo = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
  if (e.key === '/' && !escribiendo) { e.preventDefault(); $('#buscar').focus(); }
  if (e.key === 'Escape') { cerrarModal(); cerrarPanel(); }
});

$('#btnCarrito').addEventListener('click', abrirPanel);
$('#btnVerPedido').addEventListener('click', abrirPanel);
$('#btnCerrar').addEventListener('click', cerrarPanel);
$('#velo').addEventListener('click', cerrarPanel);
$('#btnVaciar').addEventListener('click', () => { if (confirm('¿Vaciar el pedido?')) vaciar(); });
$('#btnEnviar').addEventListener('click', abrirModal);
$('#btnCerrarModal').addEventListener('click', cerrarModal);
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrarModal(); });
$('#btnCopiar').addEventListener('click', copiarResumen);
$('#btnWhatsapp').addEventListener('click', enviarWhatsapp);
$('#btnNuevo').addEventListener('click', () => { vaciar(); $('#notas').value = ''; cerrarModal(); aviso('Pedido nuevo'); });
$('#nombreCliente').addEventListener('input', guardar);

/* =========================================================
   INICIO
   ========================================================= */
cargar();
renderFiltros();
renderCatalogo();
renderPedido();
</script>

<!--
=====================================================================
DECISIONES TOMADAS (detalles no definidos, resueltos a favor de la rapidez)
=====================================================================
1. Sin registro ni pasos intermedios: el pedido se arma con "+ Agregar"
   y se envía con un botón. Nombre y notas son opcionales.
2. El botón "+ Agregar" se convierte en un selector − / cantidad / +
   en la misma tarjeta; además se puede escribir la cantidad directamente.
3. En escritorio el resumen está siempre visible a la derecha; en móvil
   hay una barra fija abajo con el total y un cajón que se abre al tocarla.
4. Vista inicial en filas horizontales por categoría (estilo streaming);
   al buscar o elegir una categoría se cambia a cuadrícula para ver todo
   sin desplazarse de lado.
5. La búsqueda ignora mayúsculas y acentos, y también busca por categoría.
6. Las miniaturas se generan automáticamente (degradado + icono) para que
   el archivo funcione sin internet. Para usar fotos reales, rellena el
   campo "imagen" de cada producto con su URL.
7. El pedido y el nombre se guardan en el navegador (localStorage) para no
   perderlos si se recarga la página.
8. WhatsApp: si CONFIG.whatsapp está vacío, WhatsApp pide elegir contacto;
   configura el número del área de compras para enviarlo directo.
9. Moneda USD con formato es-MX; se cambia en CONFIG (ej. 'MXN', 'COP', 'PEN').
10. Se agrega un folio corto y la fecha al resumen para identificar el pedido.
11. Atajos: "/" enfoca la búsqueda y "Esc" cierra ventanas.
=====================================================================
-->
</body>
</html>
